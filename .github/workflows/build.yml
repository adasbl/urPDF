name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push to main: it may be the release build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Release x64
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out urPDF
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check version consistency
        run: ./scripts/check-version.ps1

      # A push to main whose subject is exactly "bump: version X.Y.Z" is a release:
      # the version in the files must equal X.Y.Z, and the release job below tags it.
      - name: Detect release commit
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $release = 'false'
          $version = ''
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
              $subject = ($env:COMMIT_MESSAGE -split "`n")[0].Trim()
              if ($subject -match '\Abump: version (\d+\.\d+\.\d+)\z') {
                  $version = $Matches[1]
                  ./scripts/check-version.ps1 -Tag "v$version"
                  $release = 'true'
              }
          }
          "release=$release" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($release -eq 'true') { "Release commit: urPDF $version" >> $env:GITHUB_STEP_SUMMARY }

      - name: Locate Visual Studio and prepare paths
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -prerelease -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudio) {
              throw 'Visual Studio 2026 with the C++ workload was not found.'
          }

          $msbuild = Join-Path $visualStudio 'MSBuild/Current/Bin/MSBuild.exe'
          $vstest = Join-Path $visualStudio 'Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe'
          $sdkHeader = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include/10.0.26100.0/um/Windows.h'
          foreach ($requiredFile in @($msbuild, $vstest, $sdkHeader)) {
              if (-not (Test-Path -LiteralPath $requiredFile)) {
                  throw "Required tool or SDK file was not found: $requiredFile"
              }
          }

          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'out/tools/vcpkg'
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          $null = New-Item -ItemType Directory -Force -Path $binaryCache, 'out/ci/logs', 'out/ci/test-results'
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV
          "VSTEST_PATH=$vstest" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_VISUAL_STUDIO_PATH=$visualStudio" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          "RUNNER_IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
          'VCPKG_DISABLE_METRICS=1' >> $env:GITHUB_ENV
          & $msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild could not be started.' }

      - name: Read pinned vcpkg revision
        id: vcpkg
        run: |
          $manifest = Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json
          $revision = $manifest.'builtin-baseline'
          if ($revision -notmatch '\A[0-9a-f]{40}\z') {
              throw 'vcpkg.json must contain a full builtin-baseline commit SHA.'
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Check out pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg.outputs.revision }}
          path: out/tools/vcpkg
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/vcpkg-binary-cache
            packages
          key: windows-vs2026-deps-v1-${{ env.RUNNER_IMAGE_VERSION }}-${{ hashFiles('vcpkg.json', 'urPDF/packages.config') }}
          restore-keys: |
            windows-vs2026-deps-v1-${{ env.RUNNER_IMAGE_VERSION }}-

      - name: Bootstrap vcpkg
        run: |
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }

      - name: Restore MuPDF dependencies
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows "--x-manifest-root=$env:GITHUB_WORKSPACE" "--x-install-root=$env:GITHUB_WORKSPACE/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency restore failed.' }

      - name: Restore NuGet packages
        run: |
          nuget restore urPDF/packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet package restore failed.' }

      # Unsigned .msixupload for the Store: Partner Center signs it after submission.
      - name: Build urPDF for Microsoft Store
        run: |
          & $env:MSBUILD_PATH urPDF/urPDF.vcxproj /m /nologo /verbosity:minimal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:VcpkgRoot=$env:VCPKG_ROOT" /p:VcpkgTriplet=x64-windows `
              /p:VcpkgManifestInstall=false /p:AppxPackageSigningEnabled=false `
              /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=StoreUpload `
              /p:AppxBundle=Never `
              /bl:out/ci/logs/urPDF-store.binlog
          if ($LASTEXITCODE -ne 0) { throw 'urPDF Store build failed.' }

      - name: Build unpackaged urPDF for MSI
        run: |
          & $env:MSBUILD_PATH urPDF/urPDF.vcxproj /m /nologo /verbosity:minimal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:VcpkgRoot=$env:VCPKG_ROOT" /p:VcpkgTriplet=x64-windows `
              /p:VcpkgManifestInstall=false /p:AppxPackage=false `
              /p:WindowsPackageType=None /p:GenerateAppxPackageOnBuild=false `
              /bl:out/ci/logs/urPDF-msi.binlog
          if ($LASTEXITCODE -ne 0) { throw 'urPDF unpackaged build failed.' }

      - name: Check version embedded in both executables
        run: ./scripts/check-version.ps1 -ExePath out/store/x64/Release/bin/urPDF.exe, out/msi/x64/Release/bin/urPDF.exe

      - name: Stage and check self-contained MSI payload
        run: ./scripts/stage-msi-payload.ps1 -Configuration Release -Platform x64

      - name: Build unit and runtime tests
        run: |
          & $env:MSBUILD_PATH tests/urPDF.UnitTests.vcxproj /m /nologo /verbosity:minimal `
              /p:Configuration=Release /p:Platform=x64 `
              /bl:out/ci/logs/unit-tests.binlog
          if ($LASTEXITCODE -ne 0) { throw 'Unit test build failed.' }

          & $env:MSBUILD_PATH tests/urPDF.RuntimeTests.vcxproj /m /nologo /verbosity:minimal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:VcpkgRoot=$env:VCPKG_ROOT" /p:VcpkgTriplet=x64-windows `
              /p:VcpkgManifestInstall=false /bl:out/ci/logs/runtime-tests.binlog
          if ($LASTEXITCODE -ne 0) { throw 'Runtime test build failed.' }

      - name: Run unit and runtime tests
        run: |
          & $env:VSTEST_PATH out/unit-tests/x64/Release/urPDF.UnitTests.dll `
              out/runtime-tests/x64/Release/urPDF.RuntimeTests.dll /Platform:x64 `
              '/Logger:trx;LogFileName=urPDF.TestResults.trx' `
              /ResultsDirectory:out/ci/test-results
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

          $report = [xml](Get-Content -LiteralPath out/ci/test-results/urPDF.TestResults.trx -Raw)
          if ([int]$report.TestRun.ResultSummary.Counters.executed -eq 0) {
              throw 'No tests were executed.'
          }

      - name: Build MSI installer
        env:
          WIX_EULA_ID: ${{ vars.WIX_EULA_ID }}
        run: |
          if (-not $env:WIX_EULA_ID) {
              throw 'WiX 7 requires accepting the OSMF EULA. Set the repository variable WIX_EULA_ID to wix7 after reading https://wixtoolset.org/osmf/.'
          }
          dotnet build installer/urPDF.wixproj -c Release -nologo -v:minimal "-p:AcceptEula=$env:WIX_EULA_ID"
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }

          $version = (Get-Content -LiteralPath vcpkg.json -Raw | ConvertFrom-Json).'version-string'
          $null = New-Item -ItemType Directory -Force -Path out/release
          Copy-Item -LiteralPath out/installer/bin/Release/urPDF.msi -Destination "out/release/urPDF-$version-x64.msi"

          $store = Get-ChildItem -LiteralPath out/store/x64/Release/packages -Filter '*.msixupload' | Select-Object -First 1
          if (-not $store) { throw 'The Store .msixupload package was not produced.' }
          Copy-Item -LiteralPath $store.FullName -Destination out/release/

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: msi-installer
          path: out/release/*.msi
          if-no-files-found: error
          retention-days: 14

      # Submit this file in Partner Center. Its manifest Identity must match the reserved
      # Store name and publisher (Package.appxmanifest) before the first submission.
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v7
        with:
          name: msix-store-upload
          path: out/release/*.msixupload
          if-no-files-found: error
          retention-days: 30

      - name: Summarize test results
        if: always()
        run: |
          $reportPath = 'out/ci/test-results/urPDF.TestResults.trx'
          if (Test-Path -LiteralPath $reportPath) {
              $report = [xml](Get-Content -LiteralPath $reportPath -Raw)
              $counters = $report.TestRun.ResultSummary.Counters
              "Tests: $($counters.executed) executed, $($counters.passed) passed, $($counters.failed) failed." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-test-x64
          path: |
            out/ci/logs
            out/ci/test-results
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download MSI installer
        uses: actions/download-artifact@v8
        with:
          name: msi-installer
          path: release

      # The tag is created by the release itself, on the commit that was built and tested.
      - name: Create tag and GitHub Release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          msi="release/urPDF-$VERSION-x64.msi"
          sha256="$(sha256sum "$msi" | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          {
            echo "urPDF $VERSION. Per-user MSI installer for Windows x64; no administrator rights needed."
            echo
            echo "SHA256: $sha256"
            echo
            echo "The installer is not code-signed, so Windows SmartScreen may show an unknown publisher warning."
          } > notes.md

          prerelease=()
          if [[ "$VERSION" == 0.* ]]; then prerelease=(--prerelease); fi

          gh release create "$tag" "$msi" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "urPDF $VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}"
